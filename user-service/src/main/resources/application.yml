micronaut:
  application:
    name: user-service
  router:
    static-resources:
      swagger:
        paths: classpath:META-INF/swagger
        mapping: /swagger/**
      swagger-ui:
        paths: classpath:META-INF/swagger/views/swagger-ui
        mapping: /swagger-ui/**
datasources:
  default:
    driver-class-name: org.postgresql.Driver
    db-type: postgres
jpa:
  default:
    properties:
      hibernate:
        hbm2ddl:
          auto: none
        connection:
          db-type: postgres
    reactive: true
eureka:
  client:
    registration:
      enabled: true
    defaultZone: ${EUREKA_HOST:localhost}:${EUREKA_PORT:8761}
flyway:
  datasources:
    default:
      enabled: true
