micronaut:
  application:
    name: user-service
  router:
    static-resources:
      swagger:
        paths: classpath:META-INF/swagger
        mapping: /swagger/**
      swagger-ui:
        paths: classpath:META-INF/swagger/views/swagger-ui
        mapping: /swagger-ui/**
  server:
    port: 9001
datasources:
  default:
    driver-class-name: org.postgresql.Driver
    db-type: postgres
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:universe-chat-user}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:123456789}
jpa:
  default:
    properties:
      hibernate:
        show_sql: true
        hbm2ddl:
          auto: none
        connection:
          driver-class-name: org.postgresql.Driver
          db-type: postgres
          url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:universe-chat-user}
          username: ${DB_USERNAME:postgres}
          password: ${DB_PASSWORD:123456789}
    reactive: true
flyway:
  datasources:
    default:
      enabled: true

endpoints:
  all:
    enabled: true
    sensitive: false
  health:
    enabled: true
    details-visible: ANONYMOUS

consul:
  client:
    discovery:
      enabled: true
    defaultZone: "${CONSUL_HOST:localhost}:${CONSUL_PORT:8500}"